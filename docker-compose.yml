services:
  postgres:
    image: postgres:16-alpine
    container_name: rumi-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rumi
    ports:
      - "5432:5432"
    volumes:
      - rumi-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rumi"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  rumi-postgres-data:
