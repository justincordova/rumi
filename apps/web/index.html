<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rumi</title>
    <link rel="icon" href="/favicon.ico" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('rumi-prefs');
          var pref = raw ? (JSON.parse(raw).state || {}).theme : 'dark';
          pref = pref || 'dark';
          // Seed next-themes' own storage key so it hydrates with the user's
          // actual preference instead of falling back to its defaultTheme and
          // momentarily overwriting the attribute we set below (theme flash for
          // non-default themes). next-themes is configured with the same key.
          if (!localStorage.getItem('rumi-theme')) {
            localStorage.setItem('rumi-theme', pref);
          }
          var resolved = pref;
          if (resolved === 'system') {
            resolved = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = resolved;
        } catch (_) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
